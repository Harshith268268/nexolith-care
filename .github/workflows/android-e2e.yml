name: Android Appium E2E Automation & GitHub Pages Reporting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily nightly regression build

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "android-e2e-pages"
  cancel-in-progress: false

env:
  BASE_URL: https://Harshith268268.github.io/nexolith-care/
  REQUIRED_PASS_PERCENTAGE: "95.0"
  ANDROID_ARCH: x86_64
  ANDROID_TARGET: default
  API_LEVEL: 30

jobs:
  android-e2e-pipeline:
    name: 21-Stage Enterprise Android E2E Appium Automation Pipeline
    runs-on: macos-latest # macOS runner provides hardware acceleration for KVM/Android Emulator

    steps:
      # Stage 1: Checkout Repository
      - name: 📥 Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      # Stage 2: Setup Java Development Kit (JDK)
      - name: ☕ Stage 2 - Setup Java 17 (Azul Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Stage 3: Setup Android SDK
      - name: 📱 Stage 3 - Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      # Stage 4: Setup Node.js & Install Appium
      - name: ⚙️ Stage 4a - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚙️ Stage 4b - Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # Stage 5: Setup Python Automation Environment
      - name: 🐍 Stage 5 - Setup Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "automation/requirements.txt"

      - name: 📦 Stage 5b - Install Automation & Reporting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      # Stage 6: Build Android Web / Mobile Application Package (APK)
      - name: 🔨 Stage 6 - Build Production Frontend Application Bundle
        run: |
          npm ci || npm install
          npm run build

      # Stage 7: Launch Android Emulator in Headless Mode
      - name: 🚀 Stage 7 - Start Android Emulator (API Level 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Android Emulator started and operational."

      # Stage 8: Verify Emulator Readiness
      - name: 🔍 Stage 8 - Verify Emulator Connectivity
        run: |
          adb devices
          adb shell getprop sys.boot_completed || true

      # Stage 9: Start Appium Server
      - name: ⚡ Stage 9 - Launch Appium Server in Background
        run: |
          appium --log-timestamp --log appium.log &
          sleep 5

      # Stage 10: Verify Appium Health
      - name: 🏥 Stage 10 - Verify Appium Server Health
        run: |
          curl -s http://127.0.0.1:4723/status || echo "Appium health ping complete."

      # Stage 11: Execute Appium 400+ E2E Test Cases
      - name: 🧪 Stage 11 - Execute Appium 400+ E2E Test Suite
        env:
          BASE_URL: https://Harshith268268.github.io/nexolith-care/
          HEADLESS: "true"
        run: |
          python automation/run_automation.py

      # Stage 12: Capture Screenshots & Device Logs
      - name: 📷 Stage 12 & 13 - Capture Screenshots & Logs
        if: always()
        run: |
          ls -la "Test Results/Screenshots/" || true
          ls -la "Test Results/Logs/" || true

      # Stage 14, 15, 16, 17: Verify Generated Reports
      - name: 📊 Stage 14-17 - Verify Excel, HTML, JSON & Summary Reports
        if: always()
        run: |
          ls -la "Test Results/Excel/"
          ls -la "Test Results/HTML/"
          ls -la "Test Results/JSON/"
          ls -la "Test Results/Summary/"

      # Stage 18: Upload Test Execution Artifacts
      - name: 📤 Stage 18 - Upload Enterprise Automation Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android-e2e-results
          path: |
            Test Results/Excel/*.xlsx
            Test Results/HTML/*.html
            Test Results/JSON/*.json
            Test Results/Summary/*.md
            Test Results/Screenshots/*.png
            Test Results/Logs/*.log
          retention-days: 30

      # Stage 19 & 20: Deploy Live Reports to GitHub Pages & Archive History
      - name: 🌐 Stage 19 & 20 - Deploy Reports to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: always()
        with:
          folder: "Test Results/HTML"
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      # Stage 21: Publish GitHub Action Summary
      - name: 📝 Stage 21 - Publish GitHub Action Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
